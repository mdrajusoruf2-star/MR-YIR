<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MR-YIR — Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      color: #2ea043;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2ea043;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2ea043;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #238636;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #8b949e;
    }

    .register a {
      color: #58a6ff;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8b949e;
      text-decoration: none;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      border-left: 4px solid #f0ad4e;
      background: #211b11;
      color: #b1bac4;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MR-YIR</div>

    <p class="subtitle">
      আপনার অ্যাকাউন্টে Login করুন
    </p>

    <form>

      <label for="email">ইমেইল</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">পাসওয়ার্ড</label>

      <input
        type="password"
        id="password"
        placeholder="আপনার পাসওয়ার্ড"
        required
      >

      <button type="submit">
        🔐 Login
      </button>

    </form>

    <div class="register">
      অ্যাকাউন্ট নেই?
      <a href="register.html">Registration করুন</a>
    </div>

    <a class="home" href="index.html">
      ← হোম পেজে ফিরে যান
    </a>

    <div class="note">
      ⚠️ এই পেজটি এখন শুধু ডিজাইন।
      পরবর্তী ধাপে নিরাপদ Authentication যুক্ত করা হবে।
    </div>

  </div>

</body>
  </html>
